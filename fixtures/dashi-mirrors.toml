# Agda's commute field returns proof-relevant Sigma in Set. The historical Lean
# mirror weakens it to Exists in Prop, so a faithful comparison must block.
[[fixture.declaration]]
agda = "DASHI.Algebra.Quantum.ConstraintClosure.Closure"
lean = "AgdaMirror.ConstraintClosure.Closure"
kind = "structure"
expected = "blocked"
expected-code = "A2L-E-PROOF-RELEVANCE"
