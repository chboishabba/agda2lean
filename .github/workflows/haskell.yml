name: Haskell

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.6"
          cabal-version: "3.10.3.0"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.6.6-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.6.6-
      - run: cabal update
      - run: cabal build all --enable-tests
      - run: cabal test all --test-show-details=direct

  agda-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.6"
          cabal-version: "3.10.3.0"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-agda-2.8-ghc-9.6.6-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-agda-2.8-ghc-9.6.6-
      - run: cabal update
      - run: cabal build -fagda-backend agda2lean-agda
      - name: Extract a typechecked Agda fixture
        run: |
          cabal run -fagda-backend agda2lean-agda -- \
            --lean-ir \
            --compile-dir build/agda-ir \
            test/agda/Identity.agda
          test -f build/agda-ir/Identity/module.a2l.cbor
